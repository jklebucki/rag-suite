services:
  docling:
    image: quay.io/docling-project/docling-serve-cu128:v1.27.0
    environment:
      DOCLING_DEVICE: cuda
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: ${DOCLING_GPU_WORKERS:-1}
      DOCLING_NUM_THREADS: ${DOCLING_GPU_CPU_THREADS:-4}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    cpus: "${DOCLING_GPU_CPU_LIMIT:-4.0}"
    mem_limit: ${DOCLING_GPU_MEMORY_LIMIT:-8g}
    gpus: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  document-processing-api:
    environment:
      DocumentProcessing__MaxConcurrentJobs: ${DOCUMENT_PROCESSING_GPU_MAX_CONCURRENT_JOBS:-1}
    cpus: "${DOCUMENT_PROCESSING_GPU_CPU_LIMIT:-1.0}"
    mem_limit: ${DOCUMENT_PROCESSING_GPU_MEMORY_LIMIT:-1g}
